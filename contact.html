<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecobazar || Home</title>
    <!-- icon  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <!-- css  -->
    <link rel="stylesheet" href="sass/main.css">
</head>

<body>
    <section class="contact container">
        <div class="contact__info">

            <div class="contact__info-item">
                <i class="fa-solid fa-location-dot contact__icon"></i>
                <p class="contact__info-text">
                    2715 Ash Dr. San Jose, South<br>
                    Dakota 83475
                </p>
            </div>

            <div class="contact__info-item">
                <i class="fa-regular fa-envelope contact__icon"></i>
                <p class="contact__info-text">
                    Proxy@gmail.com<br>
                    Help.proxy@gmail.com
                </p>
            </div>

            <div class="contact__info-item">
                <i class="fa-solid fa-phone-volume contact__icon"></i>
                <p class="contact__info-text">
                    (219) 555-0114<br>
                    (164) 333-0487
                </p>
            </div>

        </div>

        <div class="contact__form-wrapper">
            <h2 class="contact__title">Just Say Hello!</h2>

            <p class="contact__description">
                Do you fancy saying hi to me or you want to get started with your
                project and you need my help? Feel free to contact me.
            </p>

            <form class="contact__form">

                <div class="contact__form-row">
                    <input class="contact__input" type="text" name="name" placeholder="Template Cookie" required>

                    <input class="contact__input" type="email" name="email" placeholder="zakirsoft@gmail.com" required>
                </div>

                <input class="contact__input contact__input--full" type="text" name="subject" placeholder="Hello"
                    required>

                <textarea class="contact__input contact__textarea" name="message" placeholder="Subjects" rows="3"
                    required></textarea>

                <button class="btn btn--full" type="submit">
                    Send Message
                </button>
            </form>
        </div>
    </section>
</body>

</html>
